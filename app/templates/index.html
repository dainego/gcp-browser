<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Data Browser v0.8.15</title>
    <link rel="stylesheet" href="/static/style.css?v=0.8.15">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div>
            <div class="brand">GCS Data Browser <span class="version-tag">v0.8.15</span></div>
            <div class="subtitle" id="bucketName">Cargando bucket...</div>
        </div>

        <div class="topbar-actions">
            <input
                id="globalSearch"
                class="search-input"
                type="search"
                placeholder="Buscar en todo el bucket (regex)..."
                autocomplete="off"
            >

            <div class="theme-switcher" aria-label="Tema">
                <button class="theme-button" data-theme="light" title="Tema claro" aria-label="Tema claro">☀</button>
                <button class="theme-button" data-theme="dark" title="Tema oscuro" aria-label="Tema oscuro">🌙</button>
                <button class="theme-button" data-theme="premium" title="Tema premium" aria-label="Tema premium">🐂</button>
            </div>
        </div>
    </header>

    <main class="main-layout">
        <aside class="explorer-panel">
            <div class="panel-header">
                <span>Explorer</span>
                <button id="homeButton" class="icon-button" title="Ir al inicio">⌂</button>
            </div>

            <div class="explorer-storage-wrapper">
                <label for="storageSelect">Storage</label>
                <select id="storageSelect" class="select-control explorer-storage-select" title="Cambiar Storage"></select>
            </div>

            <div class="explorer-bucket-wrapper">
                <label for="bucketSelect">Bucket</label>
                <select id="bucketSelect" class="select-control explorer-bucket-select" title="Cambiar bucket"></select>
            </div>

            <div class="folder-search-wrapper">
                <input
                    id="folderSearch"
                    class="folder-search"
                    type="search"
                    placeholder="Filtrar carpetas..."
                    autocomplete="off"
                >
            </div>

            <div id="tree" class="tree"></div>
        </aside>

        <section class="content-panel">
            <div class="toolbar">
                <div id="breadcrumb" class="breadcrumb"></div>

                <div class="toolbar-actions">
                    <button id="backButton" class="secondary-button">← Atrás</button>
                    <select id="sortSelect" class="select-control">
                        <option value="name">Nombre</option>
                        <option value="size">Tamaño</option>
                        <option value="modified">Modificado</option>
                    </select>
                    <button id="directionButton" class="secondary-button">↑</button>
                </div>
            </div>

            <section class="files-section">
                <div class="section-header">
                    <div>
                        <span class="section-title">Archivos</span>
                        <span id="itemCount" class="muted">Contando elementos...</span>
                    </div>
                    <span id="currentPath" class="path-label"></span>
                </div>
                <div class="directory-search-row">
                    <input id="directorySearch" class="search-input" type="search"
                           placeholder="Buscar en este directorio (regex)..." autocomplete="off">
                    <button id="directorySearchButton" class="secondary-button">Buscar</button>
                    <button id="directorySearchClear" class="secondary-button" title="Limpiar búsqueda">Limpiar</button>
                </div>

                <div id="filesTable" class="files-table"></div>
            </section>

            <section class="details-section">
                <div class="section-header">
                    <span class="section-title">Detalle</span>
                    <span id="selectedObject" class="path-label">Ningún archivo seleccionado</span>
                </div>

                <div id="detailsEmpty" class="details-empty">
                    Seleccioná un archivo para ver sus detalles.
                </div>

                <div id="detailsContent" class="details-content hidden">
                    <div class="tabs">
                        <button class="tab active" data-tab="metadata">Metadata</button>
                        <button class="tab" data-tab="schema">Schema</button>
                        <button class="tab" data-tab="stats">Estadísticas</button>
                        <button class="tab" data-tab="preview">Preview</button>
                    </div>

                    <div id="tabMetadata" class="tab-content"></div>
                    <div id="tabSchema" class="tab-content hidden"></div>
                    <div id="tabStats" class="tab-content hidden"></div>
                    <div id="tabPreview" class="tab-content hidden"></div>
                </div>
            </section>
        </section>
    </main>
</div>

<div id="processingOverlay" class="processing-overlay hidden" role="status" aria-live="polite" aria-hidden="true">
    <div class="processing-card">
        <div class="processing-spinner" aria-hidden="true"></div>
        <div class="processing-title">Procesando...</div>
        <div class="processing-message">Esperá mientras se completa la operación</div>
    </div>
</div>

<script src="/static/app.js?v=0.8.15"></script>
</body>
</html>
